#
# The `h2` profile: an embedded H2 for the @DataJpaTest slices, in place of the demonstration database of
# application.yaml.
#
# A bare @DataJpaTest would swap the datasource for an H2 of its own, but that one runs in H2's own mode, and the
# mappings are written for PostgreSQL; upstream's own in-memory unit runs on H2 in PostgreSQL mode, so the swap is
# turned off here and the H2 is named in full, in that mode, as upstream generates its own schema into.
#
spring:
  test:
    database:
      # Keep the datasource below, instead of the H2 that @AutoConfigureTestDatabase would otherwise swap in.
      replace: none
  datasource:
    # MODE=PostgreSQL: the PostgreSQL syntax in the mappings. DATABASE_TO_LOWER=TRUE: unquoted identifiers fold to
    # lower case, as on PostgreSQL, and as upstream's own H2 unit tests set it. DEFAULT_NULL_ORDERING=HIGH: NULL sorts
    # last on ASC, as on PostgreSQL. DB_CLOSE_DELAY=-1: the database outlives the connections of the pool, as Boot's
    # own embedded URL has it. The name is random so that two contexts in one JVM do not create-drop each other's
    # tables.
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

